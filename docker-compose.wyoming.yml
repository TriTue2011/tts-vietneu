version: '3.8'

services:
  vieneu-wyoming:
    build:
      context: .
      dockerfile: Dockerfile.wyoming
    image: vieneu-wyoming:latest
    container_name: vieneu-wyoming
    ports:
      - "10200:10200"
    volumes:
      - vieneu_cache:/root/.cache/huggingface
    restart: unless-stopped
    # If you have an NVIDIA GPU, uncomment the lines below to enable GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    command: ["--uri", "tcp://0.0.0.0:10200"]

volumes:
  vieneu_cache:
